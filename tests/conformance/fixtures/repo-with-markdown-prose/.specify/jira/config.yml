# Team config for the Markdown-rendering conformance fixture (016) —
# committable, credential-free. Business-language keys; see the extension
# README for the full reference.
projects:
  - key: COMP
    style: company_managed
    priority_map:
      P1: Highest
      P2: Medium
      P3: Low
routing:
  - match:
      folder_prefix: "001-"
    project: COMP
routing_default: COMP
