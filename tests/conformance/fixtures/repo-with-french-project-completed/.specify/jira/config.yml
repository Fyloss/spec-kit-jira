# Team config for the French-hierarchy conformance fixture (US1) — a Jira
# whose issue-type names carry Latin diacritics rather than the Atlassian
# defaults (committable, credential-free). The task role (012, T006a) is the
# substrate SC-010 measures: no status name may appear in either port, in any
# spelling (FR-030).
projects:
  - key: FR
    style: company_managed
    hierarchy:
      task: "Sous-tâche"
    priority_map:
      P1: Highest
      P2: Medium
      P3: Low
routing:
  - match:
      folder_prefix: "001-"
    project: FR
routing_default: FR
