# Team config for the reconcile bridge (committable, credential-free).
# Business-language keys; see the extension README for the full reference.
projects:
  - key: COMP
    style: company_managed
    epic_strategy: per_repo
    task_strategy: subtask
    issue_types:
      Epic: "10001"
      Story: "10002"
    priority_map:
      P1: Highest
      P2: Medium
      P3: Low
routing:
  - match:
      folder_prefix: "billing-"
    project: COMP
routing_default: COMP
privacy:
  allowlist:
    - docs.example-support.atlassian.net
