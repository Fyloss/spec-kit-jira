# Machine-owned resolved identifiers (gitignored in a real repository;
# committed here only as a fixture). Reuses the company-managed hierarchy;
# the parent type (Deliverable, 10101) declares two required custom fields
# the bridge cannot supply — the gate of contracts/hierarchy-resolution.md §5.
#
# defaultable_fields (011, research R3) mirrors the mock's "parent-mandatory"
# createmeta shape (tests/conformance/mock-jira/fixtures/createmeta-fields-
# parent-mandatory.json) so a reconcile-only test — no config ceremony run —
# can exercise the consolidated question and the surviving refusal (contract
# §3.3/§3.6) directly against this fixture.
resolved_ids:
  PM:
    style: company_managed
    style_source: api
    issue_types:
      - logical_name: "Initiative"
        id: "10100"
        hierarchy_level: "2"
        subtask: false
      - logical_name: "Deliverable"
        id: "10101"
        hierarchy_level: "1"
        subtask: false
      - logical_name: "Story"
        id: "10102"
        hierarchy_level: "0"
        subtask: false
      - logical_name: "Defect"
        id: "10103"
        hierarchy_level: "0"
        subtask: false
      - logical_name: "Sub-task"
        id: "10104"
