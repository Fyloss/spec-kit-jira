# 030 — a valid two-team catalogue, no personal.yml: the config ceremony's
# personal effect must create one, with both catalogue ids in the comment.
projects:
  - key: IJT
    priority_map:
      P1: Highest
      P2: Medium
      P3: Low
routing:
  - match:
      folder_prefix: ''
    project: IJT
routing_default: IJT
teams:
  - id: ijt
    project: IJT
    folder_prefix: "ijt-"
    branch_pattern: "ijt-<ID>/<FEATURE_NAME>"
  - id: wex
    project: WEX
    folder_prefix: "wex-"
    branch_pattern: "wex-<ID>/<FEATURE_NAME>"
privacy:
  allowlist: []
