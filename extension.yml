# spec-kit-jira extension manifest — official spec-kit extension schema
# (github/spec-kit extensions/EXTENSION-DEVELOPMENT-GUIDE.md). `specify
# extension add` copies this repository's extension content into the consuming
# repository's `.specify/extensions/jira/` (dev-only material is excluded by
# `.extensionignore`).
#
# The nested `extension.version` field below is the SINGLE source of truth for
# the extension version (FR-021/FR-022). The version literal appears NOWHERE
# else in the tree except CHANGELOG.md — CI (SC-006) greps to prove it. Every
# consumer (config command, README managed-block markers, run summaries,
# upgrade check) reads it from here.
schema_version: "1.0"

extension:
  id: jira
  name: Jira Reconcile Engine
  version: 0.3.0
  description: >-
    Mirrors a repository's Spec Kit artifacts (spec.md, plan.md, tasks.md) into
    Jira Cloud as a self-healing, idempotent, fail-closed bridge. Twin native
    ports: Bash (macOS/Linux) and PowerShell 7+ (Windows).
  category: integration
  effect: read-write
  author: Fyloss
  repository: https://github.com/Fyloss/spec-kit-jira
  license: MIT
  homepage: https://github.com/Fyloss/spec-kit-jira

requires:
  speckit_version: ">=0.13.0"

provides:
  commands:
    - name: speckit.jira.config
      file: commands/speckit.jira.config.md
      description: >-
        Deterministic install ceremony — per-project metadata discovery,
        idempotent after_* hook registration, and the managed README block,
        reported as three separate effects.
    - name: speckit.jira.feature
      file: commands/speckit.jira.feature.md
      description: >-
        Ticket-first feature naming — resolve or create the Jira ticket, then
        name the branch and flat spec folder by the developer's selected team
        convention; non-blocking before_specify step.

tags:
  - jira
  - integration
  - sync
