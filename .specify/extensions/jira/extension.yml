# spec-kit-jira extension metadata.
#
# The `version` field below is the SINGLE source of truth for the extension
# version (FR-021/FR-022). The version literal appears NOWHERE else in the tree
# — CI (SC-006) greps to prove it. Every consumer (config command, README
# managed-block markers, run summaries, upgrade check) reads it from here.
id: jira
name: Jira Reconcile Engine
version: 0.1.0
description: >-
  Mirrors a repository's Spec Kit artifacts (spec.md, plan.md, tasks.md) into
  Jira Cloud as a self-healing, idempotent, fail-closed bridge. Twin native
  ports: Bash (macOS/Linux) and PowerShell 7+ (Windows).
