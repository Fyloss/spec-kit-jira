# T025 — CI: three-OS matrix running the Bash (bats) and PowerShell (Pester)
# unit suites plus the conformance corpus. The conformance corpus proves the two
# ports are byte-identical (NFR-1): each scenario runs against both ports and the
# captured stdout / exit / call-sequence / written-file tree are diffed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One live run per branch: a new push cancels the superseded run so stale
# commits never hold the runner queue (macOS runners are scarce).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bash toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq shellcheck curl

      - name: Install Bash toolchain (macOS)
        if: runner.os == 'macOS'
        # The runner image only ships Apple's Bash 3.2, which the port refuses
        # by design (prereq_check requires Bash >= 4); brew's bash lands in
        # /opt/homebrew/bin, ahead of /bin in the image PATH.
        run: brew install bats-core jq shellcheck bash

      - name: Run bats (Bash port — POSIX hosts only)
        if: runner.os != 'Windows'
        run: bats -r tests/bash

      - name: Run Pester (PowerShell port — all hosts)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0.0')) {
              Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $r = Invoke-Pester -Path tests/powershell -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }

  conformance:
    name: Conformance corpus (both ports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y bats jq curl

      - name: Run every scenario against both ports and diff the captures
        run: |
          set -euo pipefail
          shopt -s nullglob
          harness="tests/conformance/run-scenario.sh"
          failed=0
          scenarios=(tests/conformance/scenarios/*.json)
          if [ ${#scenarios[@]} -eq 0 ]; then
            echo "conformance corpus is empty — nothing to compare (scenarios land per user story)"
            exit 0
          fi
          for scenario in "${scenarios[@]}"; do
            name="$(basename "${scenario}" .json)"
            out_bash="$(mktemp -d)"
            out_ps="$(mktemp -d)"
            "${harness}" "${scenario}" bash "${out_bash}"
            "${harness}" "${scenario}" powershell "${out_ps}"
            # The observable contract: stdout, exit code, Jira call sequence, and
            # the written repository tree must be byte-identical across ports.
            for artifact in stdout exit calls.log; do
              if ! diff -u "${out_bash}/${artifact}" "${out_ps}/${artifact}"; then
                echo "::error::conformance divergence in ${name} (${artifact})"
                failed=1
              fi
            done
            if ! diff -ru "${out_bash}/workdir" "${out_ps}/workdir"; then
              echo "::error::conformance divergence in ${name} (written files)"
              failed=1
            fi
          done
          exit "${failed}"

  bash-coverage:
    name: Bash coverage (>= 80%)
    # Linux only, on purpose: kcov drives the traced script under /bin/bash, and
    # on macOS that is Apple's 3.2 (which this port refuses by design) while
    # pointing kcov at a Homebrew bash 5 aborts with "Failed to exchange stderr
    # for pipe". Ubuntu's /bin/bash is >= 4, so this is the only host where the
    # Bash twin of Pester's CodeCoverage can be measured faithfully.
    #
    # Pinned to 22.04 rather than ubuntu-latest: kcov was dropped from the Ubuntu
    # 24.04 (noble) archive, so `apt-get install kcov` there fails with "Unable to
    # locate package kcov". 22.04 (jammy) still ships it in universe — the same
    # pin the Gates workflow's coverage-bash job carries, guarded by
    # tests/bash/ci/test_workflow_kcov_runner.bats and its Pester twin.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y kcov jq curl

      # Bounded on purpose: `--mode bats` would measure the assertion-backed unit
      # suites, but kcov and bats-core's own DEBUG-trap tracing feed each other an
      # unbounded trace (91.7 GB observed before a disk filled), so the corpus
      # mode is the default and the step still carries a wall-clock guard.
      # The script carries its own wall clock and prints the exercise progress
      # when it fires, so a stall names the phase it stalled in. This step
      # budget stays comfortably above that bound on purpose: if GitHub kills
      # the step first, the diagnostics die with it — which is exactly how the
      # first run of this job reported nothing but "timed out after 20 minutes".
      - name: Measure statement coverage (Constitution XIII)
        timeout-minutes: 15
        env:
          SPEC_KIT_JIRA_COVERAGE_TIMEOUT: 600
        run: ./tests/coverage/bash-coverage.sh --mode conformance --threshold 80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bash-coverage
          # coverage/ not coverage/bash: the exercise scratch (progress.log) is
          # a sibling of kcov's report dir, and it is the only artefact a
          # stalled run leaves behind.
          path: coverage
          if-no-files-found: ignore
