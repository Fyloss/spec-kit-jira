# T025 — CI: three-OS matrix running the Bash (bats) and PowerShell (Pester)
# unit suites plus the conformance corpus. The conformance corpus proves the two
# ports are byte-identical (NFR-1): each scenario runs against both ports and the
# captured stdout / exit / call-sequence / written-file tree are diffed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One live run per branch: a new push cancels the superseded run so stale
# commits never hold the runner queue (macOS runners are scarce).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bash toolchain (Linux)
        if: runner.os == 'Linux'
        # No GNU parallel: tests/run-bash.sh shards via `xargs -P`, which is
        # always present, and never silently runs 0 tests without it (FR-003).
        run: sudo apt-get update && sudo apt-get install -y bats jq shellcheck curl

      - name: Install Bash toolchain (macOS)
        if: runner.os == 'macOS'
        # The runner image only ships Apple's Bash 3.2, which the port refuses
        # by design (prereq_check requires Bash >= 4); brew's bash lands in
        # /opt/homebrew/bin, ahead of /bin in the image PATH.
        run: brew install bats-core jq shellcheck bash

      # T003 — the install harness (tests/conformance/install-harness.sh and its
      # PowerShell twin) drives the REAL `specify extension add`. Without the CLI
      # on PATH every US1/US4 conformance case skips, and the one claim this
      # feature makes — that the official install alone registers the seven
      # events — would go unverified on every push. Installed on all three hosts
      # so both ports' harnesses run.
      - name: Install the Spec Kit CLI (install-harness dependency)
        uses: astral-sh/setup-uv@v5

      - name: Cache specify-cli (uv tool)
        # A cache hit never changes a gate verdict (Decision 4): on a miss this
        # falls through to a correct, slower install below.
        id: cache-specify-cli
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv/tools/specify-cli
          key: specify-cli-${{ runner.os }}-github-spec-kit-main

      - name: Install specify-cli
        if: steps.cache-specify-cli.outputs.cache-hit != 'true'
        run: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git

      - name: Run the Bash suite (tests/run-bash.sh — POSIX hosts only)
        if: runner.os != 'Windows'
        # Dependency-free parallel runner (Decision 3): shards via `xargs -P`,
        # no GNU parallel, no PowerShell for this step. Every mock-driving test
        # runs against the curl shim — zero pwsh processes.
        run: tests/run-bash.sh

      - name: Cache the Pester module
        id: cache-pester
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules/Pester
          key: pester-${{ runner.os }}-5.0.0

      - name: Run Pester (PowerShell port — all hosts)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0.0')) {
              Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $r = Invoke-Pester -Path tests/powershell -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }

  conformance:
    # T103 (008) — the conformance corpus proves byte-identical behaviour on
    # EVERY host this extension ships for, not just Linux: a divergence that
    # only a real Windows or macOS host would expose (path separators, line
    # endings, shell quoting) is exactly what a single-OS conformance run
    # cannot catch.
    #
    # 009 Decision 7 permits sharding the corpus WITHIN one OS — several runners
    # carrying the same `os` value, together covering every scenario exactly
    # once — and forbids spreading scenarios ACROSS the three OSes, which would
    # leave no host proving the whole corpus. `os` and `shard` are INDEPENDENT
    # matrix axes here, so every OS still runs all four shards: the rule holds by
    # construction, not by review. tests/bash/ci/test_conformance_no_cross_os_shard.bats
    # is the guard.
    #
    # Lifted out of `unit` because on windows-latest the corpus is the whole
    # cost, and because it had not completed there since 015: Pester failed
    # first and the job died at 13 minutes, so the step never ran at all.
    # Measured 2026-08-10, once that Pester failure was fixed — 3 h 38 and still
    # running unsharded, against 25-60 min per shard on the four-way probe.
    name: Conformance corpus ${{ matrix.shard }}/4 (${{ matrix.os }})
    strategy:
      # Every shard reports: cancelling siblings on the first divergence would
      # hide most of them, and the corpus exists to enumerate divergences.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    env:
      SPEC_KIT_JIRA_SHARD_TOTAL: 4
      SPEC_KIT_JIRA_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bash toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq shellcheck curl

      - name: Install Bash toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq shellcheck bash

      # The install harness drives the REAL `specify extension add`; without the
      # CLI on PATH every US1/US4 case skips, which would quietly shrink the
      # corpus this job exists to prove.
      - name: Install the Spec Kit CLI (install-harness dependency)
        uses: astral-sh/setup-uv@v5

      - name: Cache specify-cli (uv tool)
        id: cache-specify-cli
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv/tools/specify-cli
          key: specify-cli-${{ runner.os }}-github-spec-kit-main

      - name: Install specify-cli
        if: steps.cache-specify-cli.outputs.cache-hit != 'true'
        run: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git

      # `curl` ships preinstalled on all three GitHub-hosted runner images, so no
      # extra install is needed beyond the toolchain above. `shell: bash` is
      # explicit because the step's default shell on Windows is pwsh, and
      # run-scenario.sh is a bash script — it auto-detects git-bash-on-Windows
      # itself (MSYS_PWSH) and drives native pwsh.exe accordingly.
      - name: Run the conformance corpus against both ports and diff the captures
        shell: bash
        run: bash tests/conformance/ci-conformance.sh

  lint:
    # T105 (008) — Constitution XII names lint as a blocking merge gate on both
    # ports. `.shellcheckrc` and PSScriptAnalyzerSettings.psd1 already encode
    # the two ports' rule sets; until this job existed neither file was
    # enforced by anything — shellcheck was installed on the unit job above
    # and never invoked, and PSScriptAnalyzer was installed nowhere.
    name: Lint (shellcheck, PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck scripts/bash
        run: find scripts/bash -name '*.sh' -exec shellcheck -x -P scripts/bash {} +

      - name: Invoke-ScriptAnalyzer scripts/powershell
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path scripts/powershell -Recurse -Settings PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table -AutoSize | Out-String | Write-Host
              exit 1
          }

  static-checks:
    # T003 — the three static guarantees of feature 003, named as their own job
    # so a regression reports which guarantee broke rather than "a bats test
    # failed somewhere". They are cheap, they need no scratch install, and each
    # one is the mechanical enforcement of a requirement no runtime test can
    # reach:
    #   * manifest ↔ registry — the seven events are declared at the manifest
    #     root, non-optional, condition-free (FR-001..FR-004), and every
    #     hooks[].command resolves to a declared command (FR-009, SC-002);
    #   * message ↔ command — every command literal in every emitted message is
    #     runnable as spelled (FR-018, FR-030, SC-009);
    #   * no registry write — no code path in either port can open the consuming
    #     repository's hook registry for writing (FR-022, SC-011).
    name: Static checks (manifest, messages, registry writes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y bats jq

      - name: Bash port
        run: bats -r tests/bash/ci

      - name: PowerShell port
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0.0')) {
              Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $r = Invoke-Pester -Path tests/powershell/ci -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }
