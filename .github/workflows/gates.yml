# T027 — CI: blocking merge gates (Constitution XIII, FR-021/022, SC-006).
#
#   * Coverage: Bash statement coverage >= 80% via kcov (PRIMARY), with a
#     traceability FALLBACK (every shipped script has a referencing test) when
#     kcov cannot measure; PowerShell statement coverage >= 80% via Pester.
#   * Module parity: the two ports mirror module-for-module (same leaf set modulo
#     .sh <-> .psm1/.ps1, case-insensitive).
#   * Version string: the version literal lives ONLY in the root extension.yml's
#     `version` field — never in a script and nowhere else but CHANGELOG.md.
name: Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One live run per branch: a new push cancels the superseded run so stale
# commits never hold the runner queue (macOS runners are scarce).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASH_SCRIPTS: scripts/bash
  PWSH_SCRIPTS: scripts/powershell

jobs:
  changes:
    # Cheap gate in front of the expensive one: kcov+xtrace runs the whole unit
    # suite a second time under a trace, which costs more than an hour on this
    # image (see bash-coverage.sh), so PRs that never touch Bash-covered paths
    # skip it entirely. Push to main always runs the real job regardless of this
    # output — Constitution XIII's "measured on every CI run" holds unconditionally
    # there; this filter only saves iteration time on PRs whose diff cannot move
    # the number either way.
    name: Detect Bash-relevant changes
    runs-on: ubuntu-latest
    outputs:
      bash: ${{ steps.filter.outputs.bash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the diff touches Bash-covered paths
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          else
            changed=""
          fi
          # Fail open: an empty/undetermined diff runs the real gate rather than
          # skipping it, so a detection glitch can never hide a coverage drop.
          if [ -z "${changed}" ] || printf '%s\n' "${changed}" \
            | grep -qE '^(scripts/bash/|tests/bash/|tests/coverage/|tests/conformance/|packaging/|\.github/workflows/gates\.yml)'; then
            echo "bash=true" >> "${GITHUB_OUTPUT}"
          else
            echo "bash=false" >> "${GITHUB_OUTPUT}"
          fi

  coverage-bash:
    name: Bash coverage >= 80% (kcov primary, traceability fallback)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.bash == 'true' }}
    # Pinned to 22.04: kcov (the PRIMARY coverage gate per Constitution XIII) was
    # dropped from the Ubuntu 24.04 (noble) archive, so `apt-get install kcov`
    # fails on ubuntu-latest. 22.04 (jammy) still ships kcov in universe.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # T031 — cache the pinned bats-core install (a plain file copy, no
      # system-library dependency) so a cache hit skips the download+build
      # entirely; cache the apt archive directory so a hit still runs the
      # REAL `apt-get install` (dependency resolution unchanged) but skips
      # re-downloading the .deb files. Neither cache can change the gate
      # verdict: on a miss, everything installs exactly as before.
      - name: Cache bats-core v1.13.0 install
        id: cache-bats
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/bats
            /usr/local/lib/bats-core
            /usr/local/libexec/bats-core
          key: bats-core-1.13.0-${{ runner.os }}
      - name: Cache apt archives (jq, curl, kcov)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-archives-coverage-bash-${{ runner.os }}-jq-curl-kcov
      - name: Install toolchain
        # 18 seconds on every run that completes it — the ceiling is here only
        # so that a hang fails fast instead of taking the whole job with it.
        # MEASURED 2026-08-19 (run 32274698086): this step hung in apt for
        # 2 h 38 m and was still going when the run was cancelled, which meant
        # the coverage step behind it never started and the job proved nothing
        # about coverage in either direction. Neither this step nor the job
        # carried a ceiling, so the only bound was GitHub's own 6-hour cap.
        timeout-minutes: 10
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl kcov
          # Jammy's apt bats is 1.2.1, which predates BATS_TEST_TMPDIR (added in
          # bats 1.4.0) — the suite's tmpdir fixtures silently resolve to `/` on
          # it. Install a modern pinned bats-core from the upstream release.
          if [ "${{ steps.cache-bats.outputs.cache-hit }}" != 'true' ]; then
            curl -sSL https://github.com/bats-core/bats-core/archive/refs/tags/v1.13.0.tar.gz | tar xz -C /tmp
            sudo /tmp/bats-core-1.13.0/install.sh /usr/local
          fi
      - name: Measure statement coverage with kcov
        id: kcov
        # continue-on-error lets the traceability fallback rescue the JOB when
        # kcov could not measure; the fallback step re-fails on genuine failures.
        # A timeout is NOT "could not measure" — `rescue` is only set on the
        # explicit rc=2 path below, so a kill-by-timeout reaches the fallback
        # with `rescue` unset and that step fails the job genuinely (FR-016).
        continue-on-error: true
        # INVARIANT: this ceiling must stay ABOVE the two inner wall clocks plus
        # the rescue re-run below (90 + 120 + ~100 minutes — the re-run is
        # `tests/run-bash.sh`, measured at 99 minutes on this image in CI job
        # "Unit suites (ubuntu-latest)", 2026-08-19). The inner clocks are
        # the diagnostics — they print how far the exercise got and the tail of
        # kcov.log — and a step killed underneath them takes that record with it.
        # That inversion is what made this job red and undiagnosable from
        # 2026-07-28 on: the step died at 15 minutes with 30 minutes of inner
        # budget outstanding, so the fallback saw `rescue` unset and reported
        # "failed genuinely" for what was only ever a run that had not finished.
        # A ceiling is not a duration: the expected run is ~3 h, and this only
        # decides how much earlier than GitHub's own 6-hour cap a stuck run dies.
        timeout-minutes: 350
        env:
          # Both clocks are sized from the runner, never from a laptop.
          #
          # kcov drives every conformance scenario serially, in-process, under
          # the tracer. MEASURED 2026-08-10 (run 31379383480): killed at 2400 s
          # having reached scenario 72 of the 133 that existed then, with a
          # progress line at t=2399 s — steady throughput, no stall. That was
          # ~33 s per scenario, so the phase needed ~74 minutes and 90 was the
          # bound.
          #
          # The corpus is 231 scenarios as of 2026-08-19, and 024 (996ccdc) cut
          # the per-spawn cost that dominated that 33 s by ~89% on a real run —
          # the two move this number in opposite directions and neither has been
          # re-measured under kcov. 90 minutes is therefore a bound to CHECK, not
          # one to trust: an expiry here is not a failure, it returns 2 ("could
          # not measure") and the traceability fallback below takes over, so the
          # job stays green either way and the annotation names which clock went.
          #
          # The traced phase re-runs the unit suite with xtrace exported into
          # every child. `tests/run-bash.sh` alone is ~99 minutes on this image
          # (CI job "Unit suites (ubuntu-latest)", 2026-08-19) and tracing only
          # adds to it; it has never once been reached, so 120 is a first
          # measurement rather than a fitted bound. The runner now names which
          # clock expired, so an overrun reports instead of dying mute.
          SPEC_KIT_JIRA_COVERAGE_TIMEOUT: 5400
          SPEC_KIT_JIRA_COVERAGE_BATS_TIMEOUT: 7200
        run: |
          set -euo pipefail
          # Never `kcov ... bats`: kcov instruments bats-core's own DEBUG-trap
          # tracing and the two feed each other a trace that never ends (91.7 GB
          # observed). The runner keeps them apart — kcov measures the
          # conformance corpus and owns the denominator, the bats suite is
          # traced on a dedicated fd, and the two hit sets are merged.
          # --exclude-region drops the kcov-excl regions: multi-line jq string
          # literals (counted as statements by kcov's line parser, hittable by
          # nothing) and the xtrace-suspended credential/transport machinery
          # (NFR-3: secrets must never reach a trace).
          mkdir -p coverage
          # The runner explains itself on stderr, and stderr is the job log —
          # which is 403 for a reader without repository admin rights here, as
          # is the artifact. It mirrors those explanations into a file for
          # exactly that reason; this lifts them into an annotation, the one
          # channel that stays readable.
          annotate_diagnostics() {
            local f='coverage/bash-scratch/diagnostics.log'
            [ -s "${f}" ] || return 0
            echo "::error::coverage runner: $(tr '\n' ' ' < "${f}" | cut -c1-900)"
            {
              echo "### Why the coverage runner stopped"
              echo '```'
              cat "${f}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          }
          rc=0
          # stdout is teed for the step summary; stderr is deliberately NOT
          # redirected — kcov swaps its own stderr for the traced program's pipe
          # and aborts with "Failed to exchange stderr for pipe" against
          # anything but the job log.
          ./tests/coverage/bash-coverage.sh \
            --mode full --threshold 80 --report-dir coverage/bash \
            | tee coverage/bash-gate.log || rc=$?
          {
            echo "## Bash statement coverage (gate: 80%)"
            echo '```'
            cat coverage/bash-gate.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # 2 is the runner's "could not measure" (no kcov, unusable
          # interpreter, empty report); only that hands over to the fallback.
          if [ "${rc}" -eq 2 ]; then
            annotate_diagnostics
            # The parallel runner, not a serial `bats -r`: this re-run only
            # proves the suite is green before the fallback vouches for it,
            # and the serial form alone outgrows the step's own timeout.
            #
            # Its exit code is CAPTURED, never left to `set -e`: an abort here
            # takes the step out before `rescue` is recorded, and the fallback
            # then reports "no verdict" for a run whose cause is known exactly.
            # A red suite under the fallback IS a genuine failure — it just has
            # to say so itself.
            suite_rc=0
            tests/run-bash.sh || suite_rc=$?
            if [ "${suite_rc}" -ne 0 ]; then
              echo "::error::kcov could not measure, AND the suite is red on this runner (tests/run-bash.sh exit ${suite_rc}) — the traceability fallback cannot vouch for a red suite. The FAIL lines above name the files."
              exit 1
            fi
            echo "suite green but coverage unmeasurable — using the traceability fallback"
            echo "rescue=true" >> "${GITHUB_OUTPUT}"
            exit 42
          fi
          if [ "${rc}" -ne 0 ]; then
            annotate_diagnostics
            echo "::error::Bash coverage is below the 80% gate"
          fi
          exit "${rc}"
      - name: Traceability fallback (only if kcov could not measure)
        if: ${{ steps.kcov.outcome == 'failure' }}
        # Seconds of work — a grep per shipped script. Bounded for the same
        # reason as the install above: an unbounded step in this job has no
        # ceiling but GitHub's 6-hour cap.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if [ "${{ steps.kcov.outputs.rescue }}" != "true" ]; then
            # Name the cause. A verdict line in the gate log means the gate did
            # run and the number was short; no verdict line means the step never
            # reached one — killed at its ceiling, or aborted before the merge —
            # and those two are not the same failure to go and fix. The message
            # is an annotation on purpose: it is the one part of this job a
            # reader without repository admin rights can still see.
            if grep -q '^Bash statement coverage:' coverage/bash-gate.log 2> /dev/null; then
              echo "::error::$(grep -m1 '^Bash statement coverage:' coverage/bash-gate.log) — below the 80% gate"
            else
              echo "::error::the coverage step produced no verdict — it was killed at its ceiling or aborted before the merge; progress.log and kcov.log are in the bash-kcov-coverage artifact"
            fi
            exit 1
          fi
          # Every shipped script must be referenced by at least one test file.
          missing=0
          while IFS= read -r script; do
            leaf="$(basename "${script}")"
            if ! grep -rqF "${leaf}" tests/; then
              echo "::error::no test references ${script}"
              missing=1
            fi
          done < <(find "${BASH_SCRIPTS}" -name '*.sh')
          exit "${missing}"
      - name: Upload kcov output (diagnostics)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bash-kcov-coverage
          # The whole of coverage/, not coverage/bash alone: the runner writes
          # its exercise scratch to `<report-dir>-scratch` (kcov owns the report
          # directory itself), and progress.log lives there. Uploading only the
          # report discarded the one record of where a stalled run got to —
          # exactly the file the timeout diagnostics tell a reader to consult.
          path: coverage/
          if-no-files-found: ignore

  coverage-pwsh:
    name: PowerShell coverage >= 80% (Pester)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y jq curl
      - name: Cache the Pester module
        id: cache-pester
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules/Pester
          key: pester-${{ runner.os }}-5.0.0
      - name: Measure statement coverage with Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0.0')) {
              Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/powershell'
          $cfg.Run.PassThru = $true
          $cfg.CodeCoverage.Enabled = $true
          # Measure the module layer (*.psm1) — the unit-tested logic. The
          # entry-point shim (spec-kit-jira.ps1) is invoked as a `pwsh -File`
          # subprocess by the dispatch + conformance suites, which Pester's
          # in-process instrumentation structurally cannot measure; on the Bash
          # side kcov follows that child process, so both entry points are
          # behaviourally exercised. The shim carries no branching logic.
          $covFiles = Get-ChildItem -Path $env:PWSH_SCRIPTS -Recurse -Filter *.psm1 |
              Select-Object -ExpandProperty FullName
          $cfg.CodeCoverage.Path = $covFiles
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg
          if ($r.FailedCount -gt 0) { throw "Pester suite failed" }
          $pct = [double]$r.CodeCoverage.CoveragePercent
          Write-Host ("PowerShell statement coverage: {0:N2}%" -f $pct)
          if ($pct -lt 80) { throw ("PowerShell coverage {0:N2}% is below the 80% gate" -f $pct) }

  module-parity:
    name: Twin ports mirror module-for-module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the two ports' leaf sets (modulo extension + case)
        run: |
          set -euo pipefail
          # Normalise each port to <relative-dir>/<stem>, lowercased and stripped
          # of word separators, so the snake_case Bash convention (plan_apply.sh)
          # mirrors the PascalCase PowerShell convention (PlanApply.psm1) — the
          # cross-port module naming documented in tasks.md. Hyphenated shared
          # names (spec-kit-jira) normalise identically on both ports.
          bash_leaves="$(cd "${BASH_SCRIPTS}" && find . -name '*.sh' \
            | sed 's/\.sh$//' | tr '[:upper:]' '[:lower:]' | tr -d '_-' | sort)"
          pwsh_leaves="$(cd "${PWSH_SCRIPTS}" && find . \( -name '*.psm1' -o -name '*.ps1' \) \
            | sed -E 's/\.(psm1|ps1)$//' | tr '[:upper:]' '[:lower:]' | tr -d '_-' | sort)"
          if ! diff <(printf '%s\n' "${bash_leaves}") <(printf '%s\n' "${pwsh_leaves}"); then
            echo "::error::module-parity broken — the two ports do not mirror module-for-module (NFR-1/NFR-2)"
            exit 1
          fi
          echo "module parity OK"

  version-string:
    name: Version literal single-sourced (SC-006, FR-021/022)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version literal appears only in extension.yml's version field
        run: |
          set -euo pipefail
          # The manifest follows the official spec-kit extension schema: the
          # version lives in the nested `extension:` block (indented), so the
          # top-level schema_version / requires.speckit_version never match.
          version="$(sed -n 's/^[[:space:]]\{1,\}version:[[:space:]]*//p' extension.yml | head -n1)"
          [ -n "${version}" ] || { echo "::error::no version field in extension.yml"; exit 1; }
          esc="$(printf '%s' "${version}" | sed 's/\./\\./g')"
          violations=0

          # (a) No script anywhere carries the version literal (FR-021).
          if grep -rnE "${esc}" "${BASH_SCRIPTS}" "${PWSH_SCRIPTS}"; then
            echo "::error::version literal hardcoded in a script (FR-021)"
            violations=1
          fi

          # (b) Repo-wide, the literal is confined to the manifest (the source of
          #     truth) and CHANGELOG.md (the human changelog) — nowhere else
          #     (SC-006, FR-022). The design specs, CI definitions, and dev-only
          #     metadata are path-precise exclusions.
          leaks="$(grep -rnE "${esc}" . --exclude-dir=.git 2> /dev/null \
            | grep -vE "^(\./)?(extension\.yml|CHANGELOG\.md):" \
            | grep -vE "^(\./)?(specs/|\.github/|\.claude/|\.tokensave/|\.specify/)" || true)"
          if [ -n "${leaks}" ]; then
            echo "::error::version literal leaks outside extension.yml/CHANGELOG.md (SC-006):"
            echo "${leaks}"
            violations=1
          fi

          exit "${violations}"

      # T052 (026), FR-023 — the source-archive URL this feature replaced must
      # never reappear in the two consumer-facing documents: it is what made
      # the documented install command fail in the first place
      # (contracts/publication.md C3.1, C3.6). The version-literal scan above
      # already covers README.md and INSTALL.md repo-wide, so this is the one
      # check that scan does not already perform.
      - name: README.md and INSTALL.md name no repository source-archive address (FR-023)
        run: |
          set -euo pipefail
          if grep -rnF 'archive/refs/' README.md INSTALL.md; then
            echo "::error::a source-archive address reappeared in README.md or INSTALL.md (FR-023)"
            exit 1
          fi

  artifact-gates:
    # T039 (026) — the cheap release-artifact gates, on EVERY pull request:
    # build, bounds, completeness, purity, determinism, version resolution.
    # No network (the --dev corroboration inside verify-artifact.sh's
    # completeness-purity gate is skipped when `specify` is not on PATH — it
    # is optional corroboration, not this job's primary check), seconds of
    # wall clock. The expensive three-OS install proof lives in
    # install-e2e.yml instead (contracts/publication.md, plan.md "CI
    # triggering").
    name: Release artifact gates (build, bounds, completeness, purity, determinism, version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the artifact and capture its manifest
        run: packaging/build-artifact.sh "${{ runner.temp }}/spec-kit-jira-mirror.zip" | tee "${{ runner.temp }}/spec-kit-jira-mirror.manifest"

      - name: Bounds gate (entry/size/path ceilings, Windows-hostile names)
        run: packaging/verify-artifact.sh bounds "${{ runner.temp }}/spec-kit-jira-mirror.zip" "${{ runner.temp }}/spec-kit-jira-mirror.manifest"

      - name: Completeness and purity gates
        run: packaging/verify-artifact.sh completeness-purity "${{ runner.temp }}/spec-kit-jira-mirror.zip"

      - name: Determinism — building twice yields byte-identical archives (C4.1)
        run: |
          set -euo pipefail
          packaging/build-artifact.sh "${{ runner.temp }}/repeat.zip" > /dev/null
          a="$(shasum -a 256 "${{ runner.temp }}/spec-kit-jira-mirror.zip" | awk '{print $1}')"
          b="$(shasum -a 256 "${{ runner.temp }}/repeat.zip" | awk '{print $1}')"
          if [ "${a}" != "${b}" ]; then
            echo "::error::two builds from the same commit produced different archives"
            exit 1
          fi

      - name: Version resolution (single source, fails loudly if absent)
        run: packaging/resolve-version.sh
